[project]
name = "integration-envelope"
version = "1.2.0"
description = "Create and validate the integration platform's event envelope: CloudEvents 1.0 with a correlation identifier and business keys."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23,<5",
]

[project.urls]
Repository = "https://github.com/azure-intelligence-domain/contracts"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/integration_envelope"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
