name: release

# Push a tag vX.Y.Z to publish that version. The tag must match the library
# version, and every check must pass. Released versions are immutable.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Test, build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked

      - name: Tag matches library version
        run: |
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }

      - run: npx spectral lint "templates/*.yaml" "asyncapi/*.yaml" --fail-severity=warn
      - run: uv run pytest
      - run: uv build

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            schemas/envelope/*/envelope.schema.json \
            --title "${GITHUB_REF_NAME}" \
            --notes "Envelope schema and integration-envelope library ${GITHUB_REF_NAME}. Install: integration-envelope @ git+https://github.com/azure-intelligence-domain/contracts@${GITHUB_REF_NAME}"
